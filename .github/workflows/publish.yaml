name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - v*

jobs:
  publish:
    permissions:
      contents: read
      id-token: write

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          registries: https://registry.npmjs.org/|${{ secrets.NPM_TOKEN }}

      - run: bun install --frozen-lockfile
      - run: bun publish --provenance
