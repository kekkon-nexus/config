name: Build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - run: bunx npm pack
      - uses: actions/upload-artifact@v7
        with:
          path: kekkon-nexus-config-*.tgz
