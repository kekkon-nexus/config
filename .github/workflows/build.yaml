name: Build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4
      - uses: jdx/aube-action@v1
        with:
          run-install: true

      - run: aube pack
      - uses: actions/upload-artifact@v7
        with:
          path: kekkon-nexus-config-*.tgz
